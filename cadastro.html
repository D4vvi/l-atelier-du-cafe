<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - L'Atelier du Café</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="cabecalho">
        <h1 id="titulo-loja">L'Atelier du Café</h1>

        <nav id="menu">
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main id="conteudo">

        <section id="area-cadastro" class="secao">
            <h2 class="titulo-secao">Crie sua conta</h2>
            <p class="texto-secao">Preencha os campos abaixo para se cadastrar.</p>

            <form id="formulario-cadastro">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="preferencia">Sua bebida preferida</label>
                <select id="preferencia" name="preferencia" required>
                    <option value="cafe">Café</option>
                    <option value="cha-gelado">Chá Gelado</option>
                    <option value="matcha">Matcha</option>
                </select>

                <button type="submit" class="botao-enviar">Cadastrar</button>

            </form>

            <a href="index.html" class="link-voltar">Voltar para a página principal</a>
        </section>

    </main>

    <footer id="rodape">
        <p>Contato: contato@latelierducafe.com | (87) 99999-9999</p>
        <p>Rua das Flores, 123 - Centro</p>

        <div id="redes-sociais">
            <a href="https://www.instagram.com" target="_blank" class="rede-link">
                <img src="https://img.icons8.com/?size=48&id=85154&format=png" alt="Instagram">
            </a>
            <a href="https://www.facebook.com" target="_blank" class="rede-link">
                <img src="https://img.icons8.com/?size=48&id=118487&format=png" alt="Facebook">
            </a>
            <a href="https://www.whatsapp.com" target="_blank" class="rede-link">
                <img src="https://img.icons8.com/?size=48&id=85088&format=png" alt="WhatsApp">
            </a>
        </div>

        <p>&copy; 2026 L'Atelier du Café. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
